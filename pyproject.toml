[project]
name = "frigate-recap"
version = "0.1.1"
description = "Turn one day of Frigate NVR events into a single digest MP4"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Booyaka101" }]
keywords = ["frigate", "nvr", "cctv", "home-assistant", "ffmpeg", "recap", "timelapse"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
  "httpx>=0.27",
  "Pillow>=10.4",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.scripts]
frigate-recap = "frigate_recap.cli:main"

[project.urls]
Repository = "https://github.com/Booyaka101/frigate-recap"
Issues = "https://github.com/Booyaka101/frigate-recap/issues"
Changelog = "https://github.com/Booyaka101/frigate-recap/blob/main/CHANGELOG.md"
"Origin request" = "https://github.com/blakeblackshear/frigate/issues/54"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frigate_recap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "e2e: end-to-end renders that need ffmpeg on PATH (or in .tools/)",
]
